# ============================================================
# workers/api/wrangler.toml — Cloudflare Worker の設定
# このファイルは、アプリのサーバー（worker.js）を Cloudflare に置く時の設定のファイルです。
# 秘密の値はここに書かない。Cloudflare の画面（Settings → Variables and Secrets）か、
#   npx wrangler secret put SUPABASE_SERVICE_KEY
#   npx wrangler secret put GEMINI_API_KEY
# で入れる。
# ============================================================
name = "shiftapp-api"                # Worker の名前（URL の一部になる）
main = "worker.js"                   # 動かすファイル
compatibility_date = "2026-10-01"    # Cloudflare の動き方の日付

# Cloudflare の画面で入れた値（SUPABASE_URL・ALLOWED_ORIGIN・秘密の鍵）を、公開する時に消さない（2026年11月12日）
# → 値はここには書かない。全部 Cloudflare の画面（Settings → Variables and Secrets）で入れる
keep_vars = true

# 秘密ではない値（GitHub から公開する時に、この値が入る。2026年11月15日）
[vars]
SUPABASE_URL = "https://stvaodfduawfbiuvgrji.supabase.co"   # お店の Supabase の住所
ALLOWED_ORIGIN = "https://aichi21cafe-shift.pages.dev"      # アプリの URL（ここ以外のサイトからは使わせない）

# 決まった時間の仕事（2026年11月22日）：毎日 09:00 UTC ＝ 日本の 18:00 に、明日の勤務がある人へ通知（worker.js の scheduled）
[triggers]
crons = ["0 9 * * *"]
