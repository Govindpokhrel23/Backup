<!doctype html>   <!-- HTML のファイルの印 -->
<!--
  ============================================================
  tools/make-vapid.html — プッシュ通知の鍵を作るページ
  ============================================================
  このファイルは、プッシュ通知に使う「鍵のペア（公開してよい方・秘密の方）」を
  ブラウザの中だけで作るためのページのファイルです（2026年11月6日・11月15日に見直し）。
  開き方：https://aichi21cafe-shift.pages.dev/make-vapid.html（公開の時に dist に入る）
  入れる場所：お店の GitHub（cafa21sift/shift-app）→ Settings → Secrets and variables → Actions
    ・公開してよい方 → VAPID_PUBLIC_KEY
    ・秘密の方（JSON）→ VAPID_PRIVATE_JWK（秘密。ほかに貼らない）
    ・連絡先        → VAPID_SUBJECT（mailto:お店のメール）
  鍵はどこにも送られない（このページはインターネットに何も送らない）。
  1回作ったら、作り直さない（作り直すと全員の通知の登録がやり直しになる）
  ============================================================
-->
<html lang="ja">   <!-- ページの始まり -->
<head>   <!-- ページの情報 -->
  <meta charset="utf-8">   <!-- 文字コード -->
  <meta name="viewport" content="width=device-width, initial-scale=1">   <!-- スマホの幅に合わせる -->
  <meta name="robots" content="noindex">   <!-- 検索に出さない -->
  <title>通知の鍵を作る</title>   <!-- タブの名前 -->
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; line-height: 1.7; color: #2B211A; background: #F4EEE6; }   /* ページ全体の文字・幅・色 */
    textarea { width: 100%; height: 90px; font-family: ui-monospace, monospace; font-size: 13px; box-sizing: border-box; }   /* 鍵を出す欄 */
    button { font-size: 16px; padding: 10px 18px; border-radius: 10px; border: 0; background: #2B211A; color: #fff; }   /* ボタン */
    button.copy { font-size: 14px; padding: 6px 14px; margin-top: 6px; background: #6B5A4C; }   /* コピーのボタン */
    .warn { background: #FBE9E7; padding: 8px 12px; border-radius: 8px; }   /* 注意の文の背景 */
    code { background: #fff; padding: 1px 6px; border-radius: 4px; }   /* 名前の文字 */
  </style>   <!-- 見た目の終わり -->
</head>   <!-- ページの情報の終わり -->
<body>   <!-- 見える部分 -->
  <h1>プッシュ通知の鍵を作る</h1>   <!-- タイトル -->
  <p>ボタンを押すと、鍵のペアができます。<b>1回だけ</b>作って、お店の GitHub の Secrets に入れます。鍵はこのブラウザの中だけで作られ、どこにも送られません。</p>   <!-- 説明 -->
  <button id="make">鍵を作る</button>   <!-- 鍵を作るボタン -->

  <h2>① VAPID_PUBLIC_KEY（公開してよい方）</h2>   <!-- 公開してよい鍵の見出し -->
  <textarea id="pub" readonly></textarea>   <!-- 公開してよい鍵が出る欄 -->
  <button class="copy" data-target="pub">コピー</button>   <!-- コピーのボタン -->

  <h2>② VAPID_PRIVATE_JWK（秘密の方）</h2>   <!-- 秘密の鍵の見出し -->
  <p class="warn">GitHub の Secrets にだけ入れる。チャット・メール・アプリのファイルには絶対に貼らない</p>   <!-- 注意 -->
  <textarea id="priv" readonly></textarea>   <!-- 秘密の鍵が出る欄 -->
  <button class="copy" data-target="priv">コピー</button>   <!-- コピーのボタン -->

  <h2>③ VAPID_SUBJECT（連絡先）</h2>   <!-- 連絡先の見出し -->
  <p><code>mailto:</code> のあとに、お店のメールをつなげて入れる（例 <code>mailto:shop@example.com</code>）</p>   <!-- 説明 -->

  <script>
    // バイト → base64url の文字（URL で使える形）
    function toB64url(bytes) {   // バイトを base64url の文字にする関数
      let text = "";   // できる文字
      for (const byte of new Uint8Array(bytes)) text += String.fromCharCode(byte);   // 1バイトずつ文字にする
      return btoa(text).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");   // URL で使える形にする
    }
    // 「鍵を作る」を押した時：P-256 の ECDSA の鍵を作って、2つの形で見せる
    document.getElementById("make").onclick = async () => {   // ボタンを押した時
      if (document.getElementById("pub").value && !confirm("もう一度作りますか？（前に作った鍵は使えなくなります）")) return;   // 作り直しは確かめる
      const keys = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);   // 鍵のペア
      document.getElementById("pub").value = toB64url(await crypto.subtle.exportKey("raw", keys.publicKey));          // 公開してよい方
      document.getElementById("priv").value = JSON.stringify(await crypto.subtle.exportKey("jwk", keys.privateKey));   // 秘密の方
    };
    // 「コピー」を押した時：その欄の文字をコピーする
    for (const button of document.querySelectorAll("button.copy")) {   // コピーのボタンごとに
      button.onclick = async () => {   // 押した時
        const box = document.getElementById(button.dataset.target);   // コピーする欄
        if (!box.value) return;   // まだ作っていなければ何もしない
        try { await navigator.clipboard.writeText(box.value); } catch { box.select(); document.execCommand("copy"); }   // コピー（できない時は選んでコピー）
        button.textContent = "コピーしました";   // 押したことが分かるように
        setTimeout(() => { button.textContent = "コピー"; }, 1500);   // 少ししたら戻す
      };
    }
  </script>
</body>   <!-- 見える部分の終わり -->
</html>   <!-- ページの終わり -->
