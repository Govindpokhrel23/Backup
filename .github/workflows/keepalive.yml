# ============================================================
# .github/workflows/keepalive.yml — Supabase をお休みさせない・止まったら自動で戻す
# ------------------------------------------------------------
# このファイルは、3日に1回、自動で Supabase（データベース）に話しかけるファイルです（2026年11月15日）。
#
# なぜ必要か：
#   Supabase の無料プランは、7日間だれも使わないと自動で止まる（ログインできなくなる）。
#   お店がしばらくアプリを開かなくても止まらないように、GitHub が代わりに使う。
#   もし止まっていたら、自動で「Restore（もとにもどす）」を頼む（無料プランのまま。お金はかからない）。
#
# お店の GitHub の Secrets に入れておくもの：
#   SUPABASE_SERVICE_KEY  … Supabase の Secret key（もう入っている）
#   SUPABASE_ACCESS_TOKEN … Supabase のアクセストークン（sbp_…）。止まった時に Restore を頼むのに使う。秘密！
#                           入れていない時は、Restore はしないで、失敗のメールだけ届く
# 止まっていた時は、Restore を頼んだあとで「失敗」にする → お店の Gmail にメールが届いて、気づける
# さらに、GitHub に「お知らせ（Issue）」を日本語で作る → お店の Gmail に「ここを開いて Restore を押して」のメールが届く
# 直ったら、そのお知らせを自動で閉じる（「直りました」のメールが届く）
# ============================================================

name: keepalive   # GitHub の画面に出る名前

on:   # いつ動かすか
  schedule:   # 決まった時間に自動で
    - cron: "17 3 */3 * *"   # 3日に1回、日本時間の昼12時17分ごろ（GitHub は世界時間で数えるので 3時17分）
  workflow_dispatch:   # GitHub の画面のボタンからも動かせる

permissions:   # GitHub の中でさわってよいもの（安全のため、最小だけ）
  issues: write   # お知らせ（Issue）を作る・閉じるだけ。コードにはさわれない

jobs:   # やること
  ping:   # 話しかける仕事
    if: github.repository == 'cafa21sift/shift-app'   # お店の GitHub の時だけ動かす
    runs-on: ubuntu-latest   # GitHub が用意するパソコン（Linux）で動かす
    timeout-minutes: 5   # 5分で終わらなければ止める（ムダに動かさない）
    env:   # この仕事の中で使う値（秘密ではないもの）
      URL: https://stvaodfduawfbiuvgrji.supabase.co   # お店の Supabase の住所
      REF: stvaodfduawfbiuvgrji   # お店の Supabase のプロジェクトID
    steps:   # 順番
      - name: ① Supabase に話しかける   # 動いているか確かめる
        id: ping   # 下で結果を使うための名前
        continue-on-error: true   # 失敗しても次の ② に進む
        env:   # 使う値
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}   # Supabase の Secret key（秘密）
        run: |   # 動かすコマンド
          # 会社の表を1行だけ読む（データは変えない）。30秒で返事がなければ失敗
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: ${KEY}" \
            "${URL}/rest/v1/companies?select=id&limit=1" > /dev/null
          echo "Supabase は動いています"   # 成功したらログに出す

      - name: ② 止まっていたら Restore を頼む   # ① が失敗した時だけ動く
        if: steps.ping.outcome == 'failure'   # ① が失敗した時だけ
        env:   # 使う値
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}   # Supabase のアクセストークン（秘密）
        run: |   # 動かすコマンド
          if [ -z "$TOKEN" ]; then   # トークンが入っていなければ
            echo "SUPABASE_ACCESS_TOKEN がないので、自動の Restore はしません。Supabase の画面で Restore を押してください"   # 手で直す方法を出す
            exit 1   # 失敗にする（メールが届く）
          fi
          # プロジェクトの今の状態を聞く（ACTIVE_HEALTHY＝元気、INACTIVE＝お休み中）
          STATUS=$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.supabase.com/v1/projects/${REF}" | jq -r .status)
          echo "今の状態：${STATUS}"   # ログに出す
          if [ "$STATUS" = "INACTIVE" ]; then   # お休み中なら
            curl --fail --silent --show-error --max-time 30 -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://api.supabase.com/v1/projects/${REF}/restore" > /dev/null   # Restore を頼む（数分で戻る）
            echo "お休みしていたので Restore を頼みました。5分ほどで使えるようになります"   # ログに出す
          else   # お休み中ではないのに①が失敗した時
            echo "お休みではありません（${STATUS}）。鍵（SUPABASE_SERVICE_KEY）が古いか、Supabase の障害かもしれません"   # 原因の予想を出す
          fi
          exit 1   # どちらでも失敗にする（お店の Gmail にメールが届いて、気づける）

      - name: ③ 止まっていたら、お知らせ（メール）を出す   # ① が失敗した時だけ
        if: failure() && steps.ping.outcome == 'failure'   # ① か ② が失敗した時だけ
        env:   # 使う値
          GH_TOKEN: ${{ github.token }}   # この GitHub の中だけで使える使い捨ての鍵（自動で用意される）
          REPO: ${{ github.repository }}   # このリポジトリの名前
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}   # 今回のログの URL
        run: |   # 動かすコマンド
          # もう開いているお知らせがあれば、新しく作らない（同じメールを何回も送らない）
          OPEN=$(gh issue list --repo "$REPO" --label keepalive --state open --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then echo "お知らせはもう出ています"; exit 0; fi   # あれば終わる
          gh label create keepalive --repo "$REPO" --color D93F0B --description "Supabase の自動チェック" 2>/dev/null || true   # ラベルがなければ作る
          gh issue create --repo "$REPO" --label keepalive \
            --title "【要確認】シフトアプリのデータベース（Supabase）が止まっています" \
            --body "$(printf '%s\n' \
              '自動チェックで、Supabase に返事がありませんでした。' \
              '自動で Restore（もとにもどす）を頼みましたが、念のため確認してください。' \
              '' \
              '## やること' \
              '1. お店の Gmail で下を開く' \
              '   https://supabase.com/dashboard/project/stvaodfduawfbiuvgrji' \
              '2. 「Restore」ボタンがあれば押す（数分で戻ります。お金はかかりません）' \
              '3. アプリを開いてログインできるか確かめる' \
              '   https://aichi21cafe-shift.pages.dev' \
              '' \
              '直ると、次の自動チェック（3日ごと）でこのお知らせは自動で閉じます。' \
              '' \
              "くわしいログ：${RUN}")"   # お知らせを作る（お店の Gmail にメールが届く）

      - name: ④ 直っていたら、お知らせを閉じる   # ① が成功した時だけ
        if: steps.ping.outcome == 'success'   # ① が成功した時だけ
        env:   # 使う値
          GH_TOKEN: ${{ github.token }}   # この GitHub の中だけで使える使い捨ての鍵
          REPO: ${{ github.repository }}   # このリポジトリの名前
        run: |   # 動かすコマンド
          # 開いているお知らせを全部閉じる（なければ何もしない）
          for n in $(gh issue list --repo "$REPO" --label keepalive --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$REPO" --comment "自動チェックで Supabase が動いているのを確かめました。直りました ✅"   # 閉じる（メールが届く）
          done

      - name: ⑤ 動いていたら「問題なく起動」をメールで知らせる   # ① が成功した時だけ
        if: steps.ping.outcome == 'success'   # ① が成功した時だけ
        env:   # 使う値
          GH_TOKEN: ${{ github.token }}   # この GitHub の中だけで使える使い捨ての鍵
          REPO: ${{ github.repository }}   # このリポジトリの名前
        run: |   # 動かすコマンド
          # 記録用のお知らせ（1つだけ）を探す。なければ作る
          N=$(gh issue list --repo "$REPO" --label keepalive-ok --state open --json number --jq '.[0].number // empty')
          if [ -z "$N" ]; then   # まだなければ
            gh label create keepalive-ok --repo "$REPO" --color 0E8A16 --description "サーバの自動チェックの記録" 2>/dev/null || true   # ラベルを作る
            gh issue create --repo "$REPO" --label keepalive-ok --title "サーバの自動チェックの記録（3日ごと）" --body "3日ごとに、ここに結果が書かれます（お店の Gmail にも届きます）。"   # 記録用のお知らせを作る
            N=$(gh issue list --repo "$REPO" --label keepalive-ok --state open --json number --jq '.[0].number')   # 作った番号
          fi
          gh issue comment "$N" --repo "$REPO" --body "✅ サーバ問題なく起動（$(TZ=Asia/Tokyo date '+%Y年%m月%d日 %H:%M')）"   # 一言だけ書く → メールが届く
