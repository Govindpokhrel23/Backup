# ============================================================
# .github/workflows/deploy.yml — GitHub から Cloudflare に自動で公開する
# ------------------------------------------------------------
# このファイルは、GitHub の main に保存（push）した時に、
#   ① テストを動かす
#   ② サーバー（workers/api）を Cloudflare Worker に公開する
#   ③ アプリ（dist）を Cloudflare Pages に公開する
# を自動でやる GitHub Actions のファイルです（2026年11月12日）。
#
# お店の GitHub（cafa21sift/shift-app）の Settings → Secrets and variables → Actions に入れておくもの：
#   CLOUDFLARE_API_TOKEN  … Cloudflare の API トークン（Workers と Pages を編集できるもの）。秘密！
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウントID（秘密ではないが、ここに書かない）
#   SUPABASE_SERVICE_KEY  … Supabase の Secret key（sb_secret_…）。Worker に入る。秘密！
#   GEMINI_API_KEY        … Gemini の鍵（AIza…）。Worker に入る。秘密！
#   VAPID_PUBLIC_KEY      … 通知の鍵（公開してよい方）。Worker とアプリの config.js に入る（2026年11月15日）
#   VAPID_PRIVATE_JWK     … 通知の鍵（秘密の方。{"kty":"EC",… の形）。Worker にだけ入る。秘密！
#   VAPID_SUBJECT         … 通知を送る人の連絡先（mailto:お店のメール）。Worker に入る
#   ※ 通知の鍵は https://aichi21cafe-shift.pages.dev/make-vapid.html で作る（1回だけ）
# Worker の URL は公開した時に分かるので、アプリの config.js に自動で入れる（手で書かなくてよい）
# ============================================================

name: deploy   # GitHub の画面に出る名前

on:   # いつ動かすか
  push:   # 保存（push）した時
    branches: [main]   # main に保存した時だけ
  workflow_dispatch:   # GitHub の画面のボタンからも動かせる

concurrency:   # 同時に2つ動かさない
  group: deploy   # 同じグループ
  cancel-in-progress: false   # 動いている途中のものは止めない（最後まで公開する）

jobs:   # やること
  deploy:   # 公開する仕事
    if: github.repository == 'cafa21sift/shift-app'   # お店の GitHub の時だけ公開する（個人の GitHub では動かさない）
    runs-on: ubuntu-latest   # GitHub が用意するパソコン（Linux）で動かす
    steps:   # 順番
      - uses: actions/checkout@v4   # コードを取ってくる

      - uses: actions/setup-node@v4   # Node.js を用意する
        with:   # 設定
          node-version: 22   # Node.js の版

      - name: テストを動かす   # ① まちがいがあれば、ここで止まって公開しない
        run: |   # 動かすコマンド
          npm ci   # テストの道具を入れる
          npm test   # 全部のテスト

      - name: サーバー（Worker）を公開する   # ②
        id: worker   # 下で URL を使うための名前
        uses: cloudflare/wrangler-action@v3   # Cloudflare の公式の道具
        with:   # 設定
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # 秘密のトークン
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}   # アカウントID
          workingDirectory: workers/api   # Worker のフォルダ（wrangler.toml がある所）
          command: deploy   # 公開する
          secrets: |   # Worker に入れる秘密の値（GitHub の Secrets から）
            SUPABASE_SERVICE_KEY
            GEMINI_API_KEY
        env:   # 上の秘密の値の中身
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}   # Supabase の Secret key
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # Gemini の鍵

      - name: 通知の鍵を Worker に入れる   # ②の続き（鍵が GitHub に入っている時だけ。2026年11月15日）
        working-directory: workers/api   # Worker のフォルダ
        env:   # 使う値
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # 秘密のトークン
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}   # アカウントID
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}   # 通知の鍵（公開してよい方）
          VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}   # 通知の鍵（秘密の方）
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}   # 通知を送る人の連絡先
        run: |   # 動かすコマンド
          if [ -z "$VAPID_PRIVATE_JWK" ] || [ -z "$VAPID_PUBLIC_KEY" ]; then echo "通知の鍵がまだないので、とばします"; exit 0; fi   # 鍵がなければ何もしない
          FILE="$RUNNER_TEMP/vapid.json"   # 一時ファイル（GitHub のパソコンの中だけ。終わったら消す）
          node -e 'const e=process.env;require("fs").writeFileSync(process.argv[1],JSON.stringify({VAPID_PUBLIC_KEY:e.VAPID_PUBLIC_KEY,VAPID_PRIVATE_JWK:e.VAPID_PRIVATE_JWK,VAPID_SUBJECT:e.VAPID_SUBJECT||"mailto:admin@example.com"}))' "$FILE"   # 3つを1つのファイルにまとめる
          npx --yes wrangler@3 secret bulk "$FILE"   # Worker の秘密の値にまとめて入れる
          rm -f "$FILE"   # 一時ファイルを消す

      - name: アプリのファイルを作る   # ③ の準備
        env:   # 使う値
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}   # 通知の鍵（公開してよい方）。config.js に入れる
        run: |   # 動かすコマンド
          sh tools/make-site.sh   # dist フォルダを作る
          # 公開した Worker の URL を、アプリの設定（config.js）に自動で入れる
          if [ -n "${{ steps.worker.outputs.deployment-url }}" ]; then
            sed -i "s#API_WORKER_URL: \"[^\"]*\"#API_WORKER_URL: \"${{ steps.worker.outputs.deployment-url }}\"#" dist/js/config.js
          fi
          # 通知の鍵（公開してよい方）を、アプリの設定（config.js）に自動で入れる
          if [ -n "$VAPID_PUBLIC_KEY" ]; then
            sed -i "s#VAPID_PUBLIC_KEY: \"[^\"]*\"#VAPID_PUBLIC_KEY: \"${VAPID_PUBLIC_KEY}\"#" dist/js/config.js
          fi
          grep -n "API_WORKER_URL:\|VAPID_PUBLIC_KEY:" dist/js/config.js   # 入った値をログに出す（どちらも公開してよい値）

      - name: アプリ（Pages）の入れ物を用意する   # はじめての時だけ作る（もうあれば何もしない）
        uses: cloudflare/wrangler-action@v3   # Cloudflare の公式の道具
        continue-on-error: true   # もうある時のエラーは気にしない
        with:   # 設定
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # 秘密のトークン
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}   # アカウントID
          command: pages project create aichi21cafe-shift --production-branch main   # Pages の入れ物を作る

      - name: アプリ（Pages）を公開する   # ③
        uses: cloudflare/wrangler-action@v3   # Cloudflare の公式の道具
        with:   # 設定
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # 秘密のトークン
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}   # アカウントID
          command: pages deploy dist --project-name aichi21cafe-shift --branch main   # dist を公開する
